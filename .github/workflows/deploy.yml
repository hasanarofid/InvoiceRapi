name: Deploy InvoiceRapi to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via Native SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Pastikan SSH_HOST, SSH_USER, dan SSH_PRIVATE_KEY telah diisi di GitHub Repository Secrets."
            exit 1
          fi

          CLEAN_HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          CLEAN_USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          CLEAN_PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          if [ -z "$CLEAN_PORT" ]; then CLEAN_PORT="22"; fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "🔍 Validating deploy key fingerprint..."
          ssh-keygen -lf ~/.ssh/id_deploy || true

          echo "🚀 Connecting to $CLEAN_USER@$CLEAN_HOST on port $CLEAN_PORT..."

          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              -i ~/.ssh/id_deploy \
              -p "$CLEAN_PORT" \
              "$CLEAN_USER@$CLEAN_HOST" 'bash -se' << 'EOF'
            set -e
            echo "🚀 Starting automated deployment for invoicerapi.synbarra.com..."
            
            TARGET_DIR="/var/www/invoicerapi.synbarra.com"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Error: Target directory $TARGET_DIR does not exist yet. Please run initial git clone on VPS first."
              exit 1
            fi

            cd "$TARGET_DIR"

            echo "📥 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard HEAD
            git checkout -B main origin/main --force
            git reset --hard origin/main

            echo "📦 Installing composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            echo "⚡ Building frontend assets..."
            npm ci || npm install
            npm run build

            echo "🧹 Refreshing and optimizing caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "🔒 Ensuring correct permissions..."
            mkdir -p "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache"
            chown -R www-data:www-data "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache"
            chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache"

            echo "🔄 Reloading PHP-FPM..."
            systemctl reload php8.5-fpm

            echo "✅ Deployment completed successfully for invoicerapi.synbarra.com!"
          EOF
