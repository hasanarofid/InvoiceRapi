name: Deploy to Production (Synbarra Technologies)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via Native SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Pastikan SSH_HOST, SSH_USER, dan SSH_PRIVATE_KEY telah diisi di GitHub Repository Secrets."
            exit 1
          fi

          TARGET_PORT="${SSH_PORT:-22}"
          if [ -z "$TARGET_PORT" ]; then TARGET_PORT="22"; fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "🚀 Connecting to $SSH_USER@$SSH_HOST on port $TARGET_PORT..."

          # Execute deployment on VPS with resilient SSH configuration
          ssh -i ~/.ssh/id_deploy \
              -p "$TARGET_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "🚀 Starting automated deployment for synbarra.com..."
            cd /var/www/synbarra.com

            echo "📥 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard HEAD
            git checkout -B main origin/main --force
            git reset --hard origin/main

            echo "📦 Installing composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Running database migrations and seeders..."
            php artisan migrate --force
            php artisan db:seed --class=SynbarraSeeder --force

            echo "⚡ Building frontend assets..."
            npm ci || npm install
            npm run build

            echo "🧹 Refreshing and optimizing caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "🔒 Ensuring correct permissions..."
            chown -R www-data:www-data /var/www/synbarra.com/storage /var/www/synbarra.com/bootstrap/cache
            chmod -R 775 /var/www/synbarra.com/storage /var/www/synbarra.com/bootstrap/cache

            echo "🔄 Reloading PHP-FPM..."
            systemctl reload php8.5-fpm

            echo "✅ Deployment completed successfully for synbarra.com!"
          EOF
